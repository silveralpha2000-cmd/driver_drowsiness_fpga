model:
  name: DriverPoseNet7KP
  input_shape: [3, 256, 192]   # [C, H, W]
  output_shape: [7, 64, 48]    # [keypoints, H, W]
  num_keypoints: 7
  heatmap_resolution: [64, 48]
  gaussian_sigma: 2.0

  # Architecture
  stem:
    conv: [3, 32, k=3, s=2, p=1]   # 256x192 -> 128x96
    bn: true
    relu: true
    maxpool: [k=3, s=2, p=1]       # 128x96 -> 64x48

  residual_blocks:
    - in: 32, out: 64, stride: 2   # 64x48 -> 32x24
    - in: 64, out: 128, stride: 2  # 32x24 -> 16x12
    - in: 128, out: 256, stride: 2 # 16x12 -> 8x6

  upsample:
    - in: 256, out: 128, scale: 2  # 8x6 -> 16x12
    - in: 128, out: 64,  scale: 2  # 16x12 -> 32x24
    - in: 64,  out: 32,  scale: 2  # 32x24 -> 64x48

  head:
    conv1x1: [32, 7]               # final 7-channel heatmap head

  quantization:
    enabled: true
    weight_bits: 8
    activation_bits: 8
    accumulator_bits: 32
    per_channel: true
